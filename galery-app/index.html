<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galery App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🖼️ Galeri Foto</h1>
        <p>Koleksi foto-foto indah dari berbagai kategori</p>
      </div>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">Semua</button>
        <button class="filter-btn" data-filter="nature">Alam</button>
        <button class="filter-btn" data-filter="city">Kota</button>
        <button class="filter-btn" data-filter="abstract">Abstrak</button>
      </div>

      <div class="gallery" id="gallery"></div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
      <div class="modal-content">
        <button class="close-btn" id="closeModal">&times;</button>
        <button class="nav-btn prev-btn" id="prevBtn">‹</button>
        <button class="nav-btn next-btn" id="nextBtn">›</button>
        <img id="modalImg" src="" alt="" />
        <div class="modal-info">
          <h3 id="modalTitle"></h3>
          <p id="modalCategory"></p>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
